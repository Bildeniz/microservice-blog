services: 
  user-service:
    build:
      context: ./User 
      dockerfile: Dockerfile
    container_name: blog_user_service
    env_file:
      - ./User/.env
    depends_on:
      - user-db
    networks:
      - user-service-network

    ports:
      - 8080:80

  user-db:
    image: postgres:18
    container_name: blog_user_db
    env_file:
      - ./User/.env
    volumes:
      - user-db-data:/var/lib/postgresql
    networks:
      - user-service-network

    ports:
      - 5432:5432 # TODO: before production delete it


volumes:
  user-db-data:

networks:
  user-service-network:
    driver: bridge